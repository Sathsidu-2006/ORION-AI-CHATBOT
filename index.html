<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION AI Chatbot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main">
        <div class="left-div">
            <img src="assets/ORION AI Futuristic Neon Logo.png" alt="" class="logo">
        </div>
        <div class="right-div">
            <div class="heading-container">
                <h1 class="heading">Where should we begin ? </h1>
                <p class="h-p">I'm ORION, your AI companion. Ask me anything, explore ideas, or let's create something extraordinary together.</p>
            </div>
            <div class="chat-Container">
                <div class="chat-box" id="chat-box">
                    
                </div>
                <div class="input-area">
                    <input type="text" placeholder="type your message" id="user-input" class="user-input">
                    <input type="submit" class="send-btn" value="Send" onclick="sendMessageOnAction()">
                </div>     
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
